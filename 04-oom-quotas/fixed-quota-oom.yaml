apiVersion: v1
kind: ResourceQuota
metadata:
  name: prod-inventory-quota
  namespace: prod-inventory
spec:
  hard:
    limits.memory: "1Gi"
    requests.memory: "1Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: prod-inventory-defaults
  namespace: prod-inventory
spec:
  limits:
  - default:
      memory: "256Mi"
    defaultRequest:
      memory: "128Mi"
    type: Container
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-cache
  namespace: prod-inventory
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-cache
  template:
    metadata:
      labels:
        app: inventory-cache
    spec:
      containers:
      - name: cache
        image: polinux/stress
        command: ["stress", "--vm", "1", "--vm-bytes", "150M", "--vm-hang", "1"]
        resources:
          requests:
            memory: "192Mi"
          limits:
            memory: "256Mi"
